<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felipe Portfolio - Content Manager</title>
  <link rel="stylesheet" href="./global.css">
  <link rel="stylesheet" href="./mpProject/index.css">
  <script type="module" src="./randomWords.js"></script>
</head>
<body>
  <header>
    <h1>Testimonial</h1>
  </header>

  <main>
    <form action="http://localhost:8080/testimonials" method="post" id="projectForm" enctype="multipart/form-data">
      <h2>About the Author</h2>

      <label for="id">Id</label>
      <input type="text" name="id" placeholder="Author ID" maxlength="8" required>
      
      <label for="author">Author</label>
      <input type="text" name="author" placeholder="Author Name" maxlength="24" required>

      <label for="role">Role</label>
      <input type="text" name="role" placeholder="Author Role" maxlength="16" required>
      
      <label for="company">Company</label>
      <input type="text" name="company" placeholder="Author Company" maxlength="16" required>

      <label for="message" class="large-textbox">Message</label>
      <textarea name="message" cols="30" rows="10" placeholder="Message"></textarea>

      <label for="picture">Choose Picture</label>
      <input type="file" name="picture" accept="image/webp" required>
      
      
      <input id="submit" type="submit" value="Submit" formenctype="multipart/form-data">
    </form>
  </main>
</body>
</html>
